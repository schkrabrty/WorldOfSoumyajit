{% if site.analytics_id and page.analytics != false %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics_id | url_encode }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', {{ site.analytics_id | jsonify }});
    </script>
{% endif %}
