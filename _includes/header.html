<header id="header" aria-label="Site header">
    <div class="inner">
        <a href="{{ '/' | relative_url }}" class="logo" aria-label="Go to homepage">
            <span class="symbol"><img src="{{ site.profile_image | escape }}" loading="lazy" alt="{{ site.profile_image_alt | escape }}" decoding="async" /></span><span class="title">{{ site.name | escape }}</span>
        </a>
        <nav aria-label="Primary navigation">
            <ul><li><a href="#menu" role="button" aria-controls="menu" aria-expanded="false" aria-haspopup="dialog">Menu</a></li></ul>
        </nav>
    </div>
</header>
